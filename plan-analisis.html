 x="523" y="127">T3</text><text x="342" y="421">Síntomas psicopatológicos</text><ellipse cx="342" cy="387" rx="103" ry="15" fill="white" stroke="#315b73"/><text x="342" y="391">Intercepto · nivel inicial</text><ellipse cx="342" cy="267" rx="103" ry="15" fill="white" stroke="#315b73"/><text x="342" y="271">Pendiente · ritmo de cambio</text><path d="M289 374 L161 334" stroke="#002842" fill="none" marker-end="url(#lg)"/><path d="M289 280 L161 304" stroke="#002842" stroke-dasharray="4 3" fill="none" marker-end="url(#lg)"/><text x="235" y="357">1</text><text x="235" y="296">0</text><rect x="121" y="305" width="80" height="28" rx="3" fill="white" stroke="#315b73"/><text x="161" y="323">T1</text><path d="M342 372 L342 334" stroke="#002842" fill="none" marker-end="url(#lg)"/><path d="M342 282 L342 304" stroke="#002842" stroke-dasharray="4 3" fill="none" marker-end="url(#lg)"/><text x="352" y="357">1</text><text x="352" y="296">1</text><rect x="302" y="305" width="80" height="28" rx="3" fill="white" stroke="#315b73"/><text x="342" y="323">T2</text><path d="M395 374 L523 334" stroke="#002842" fill="none" marker-end="url(#lg)"/><path d="M395 280 L523 304" stroke="#002842" stroke-dasharray="4 3" fill="none" marker-end="url(#lg)"/><text x="469" y="357">1</text><text x="469" y="296">2</text><rect x="483" y="305" width="80" height="28" rx="3" fill="white" stroke="#315b73"/><text x="523" y="323">T3</text><path d="M235 55H39Q25 55 25 69V373Q25 387 39 387H235" fill="none" stroke="#17743c" stroke-width="1.6" marker-start="url(#lgc)" marker-end="url(#lgc)"/><text x="15" y="221" transform="rotate(-90 15 221)" style="fill:#146635">Covarianza entre interceptos</text><path d="M342 194V248" fill="none" stroke="#17743c" stroke-width="2.6" marker-start="url(#lgc)" marker-end="url(#lgc)"/><text x="449" y="225" style="fill:#146635">Covarianza entre pendientes</text></svg>



<span>¿Se asocian los cambios en personalidad con los cambios en psicopatología?</span></template>
<dialog id="detail" aria-labelledby="detail-title"><form method="dialog"><button aria-label="Cerrar">×</button></form><h2 id="detail-title"></h2><div id="diagram"></div><p id="description"></p><a id="source" target="_blank" rel="noopener">Referencia del modelo</a></dialog>
<script>
const note=document.querySelector('#nota');
const intro=note.textContent;
for(const b of document.querySelectorAll('[data-cohort]')) b.onclick=()=>{
  for(const tab of document.querySelectorAll('[data-cohort]')) {
    const active=tab===b;
    tab.setAttribute('aria-pressed',active);
    document.querySelector('#cohorte'+tab.dataset.cohort).hidden=!active;
  }
  note.textContent=intro;
};
for(const task of document.querySelectorAll('.task')) task.onclick=()=>{note.textContent=task.dataset.note};
const model=document.querySelector('#model'), detail=document.querySelector('#detail');
let current=0;
const info=[
 ['Adaptación del panel clásico de la figura 1. Las dobles flechas representan la covarianza inicial y las covarianzas residuales de las oleadas posteriores.','https://doi.org/10.1080/10705511.2020.1784738'],
 ['Adaptación del panel RI-CLPM de la figura 1. Se omiten las medias y las varianzas.','https://doi.org/10.1080/10705511.2020.1784738'],
 ['El modelo estima un nivel inicial y una pendiente por proceso. La doble flecha representa la covarianza entre las pendientes individuales: si quienes tienden a aumentar más en un rasgo también tienden a aumentar más en síntomas. La otra doble flecha representa la covarianza entre niveles iniciales. Las flechas continuas muestran las cargas del intercepto (1, 1, 1) y las discontinuas las de la pendiente (0, 1, 2), en orden T1–T3. La figura resume estas dos asociaciones y omite otras rutas del modelo.','https://www.statmodel.com/usersguide/chap6/ex6.13.html']
];
function select(i){
 current=i;
 model.replaceChildren(document.querySelector('#model'+i).content.cloneNode(true));
 for(const tab of document.querySelectorAll('[data-model]')) tab.setAttribute('aria-pressed',Number(tab.dataset.model)===i);
}
for(const tab of document.querySelectorAll('[data-model]')) tab.onclick=()=>select(Number(tab.dataset.model));
model.onclick=()=>{
 document.querySelector('#detail-title').textContent=model.querySelector('strong').textContent;
 const diagram=model.querySelector('svg').cloneNode(true);
 for(const marker of diagram.querySelectorAll('marker')) {
  const old=marker.id; marker.id=old+'-detail';
  for(const path of diagram.querySelectorAll('path')) for(const attr of ['marker-start','marker-end']) if(path.getAttribute(attr)==='url(#'+old+')') path.setAttribute(attr,'url(#'+marker.id+')');
 }
 document.querySelector('#diagram').replaceChildren(diagram);
 document.querySelector('#description').textContent=info[current][0];
 document.querySelector('#source').href=info[current][1];
 detail.showModal();
};
detail.onclick=e=>{if(e.target===detail){const r=detail.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)detail.close()}};
select(0);
</script></html>
